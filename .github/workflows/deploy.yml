name: Deploy

on:
  push:
    branches: [main]

# Prevent overlapping deploys — queue, don't cancel
concurrency:
  group: deploy-cadence
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ── Build the UI in CI (NOT on the droplet — 2GB RAM / tight disk
      #    can't reliably run a Vite build) ──────────────────────────────
      - name: Build UI
        working-directory: ui
        env:
          # Set this as a repo variable: Settings → Secrets and variables
          # → Actions → Variables → VITE_API_URL (e.g. https://cadence.brndn.me/api)
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          bun install --frozen-lockfile
          bun run build

      # ── Set up SSH (key + known_hosts) for rsync and remote deploy ────
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # ── Ship the prebuilt UI artifact (--delete prunes stale files) ───
      - name: Rsync UI build to droplet
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            ui/dist/ \
            "$DROPLET_USER@$DROPLET_HOST:/usr/share/nginx/cadence/ui/dist/"

      # ── Run the server-side deploy (pull, api install, migrate, restart) ─
      - name: Remote deploy
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DROPLET_USER@$DROPLET_HOST" \
            'cd /usr/share/nginx/cadence && ./deploy.sh'
